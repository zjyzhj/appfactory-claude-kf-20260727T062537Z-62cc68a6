appId: com.appfactory.tourwise.app
---
- launchApp:
    appId: com.appfactory.tourwise.app
    arguments:
      "-syntheticCapture": "1"
- extendedWaitUntil: {visible: "12 Willow Lane, Apt 3", timeout: 15000}
- tapOn: "Add viewing"
- assertVisible: "New Viewing"
- tapOn: "123 Main St, Apt 4B"
- inputText: "88 Harbor View, Unit 12"
- pressKey: enter
- tapOn: "Save"
- extendedWaitUntil: {visible: "Scoring: Kitchen", timeout: 15000}
- tapOn: "Take Photo"
- extendedWaitUntil: {visible: "Kitchen evidence photo 1 of 1", timeout: 8000}
- tapOn: "2 of 5 for Natural Light"
- scrollUntilVisible: {element: "2 of 5 for Kitchen", direction: DOWN}
- tapOn: "2 of 5 for Kitchen"
- scrollUntilVisible: {element: "Save and go to next room", direction: DOWN}
- tapOn: "Save and go to next room"
- extendedWaitUntil: {visible: "Scoring: Living", timeout: 8000}
- tapOn: "Finish"
- waitForAnimationToEnd: {timeout: 8000}
- takeScreenshot: f02_00_finish_summary
- tapOn: {point: "50%, 85%"}
- extendedWaitUntil: {visible: "88 Harbor View, Unit 12", timeout: 10000}
- takeScreenshot: f02_01_two_viewings
