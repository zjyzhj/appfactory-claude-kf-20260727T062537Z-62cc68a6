appId: com.appfactory.tourwise.app
---
- launchApp:
    appId: com.appfactory.tourwise.app
    arguments:
      "-syntheticCapture": "1"
- extendedWaitUntil: {visible: "5 Pine Court", timeout: 15000}
- tapOn: "5 Pine Court"
- extendedWaitUntil: {visible: "Resume Walkthrough", timeout: 8000}
- tapOn: "Resume Walkthrough"
- extendedWaitUntil: {visible: "Scoring: Kitchen", timeout: 10000}
- tapOn: "Finish"
- waitForAnimationToEnd: {timeout: 8000}
- takeScreenshot: f09_01_finish_summary
- tapOn: {point: "50%, 85%"}
- extendedWaitUntil: {visible: "5 Pine Court", timeout: 10000}
- takeScreenshot: f09_02_pine_toured
